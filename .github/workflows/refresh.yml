name: 데이터 자동 갱신

on:
  schedule:
    - cron: "17 20 * * 1"   # 매주 월요일 20:17 UTC (한국 화요일 05:17)
  workflow_dispatch:          # 저장소 Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 환율 등 갱신
        run: node scripts/refresh.mjs

      - name: 검증
        run: node scripts/validate.mjs

      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- data.js; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: 데이터 자동 갱신 (환율) [skip ci]"
          git push
